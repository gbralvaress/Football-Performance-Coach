<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07110d">
<title>FPC PRO — Athlete Performance</title>
<style>
:root{--bg:#050b08;--panel:#0b1510;--panel2:#101f17;--line:#203a2b;--txt:#f4f8f5;--muted:#8fa79a;--green:#4df28a;--green2:#1ca85b;--yellow:#ffd166;--red:#ff6b6b;--blue:#69a7ff}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 80% 0,#143522 0,#07100b 34%,#050b08 75%);color:var(--txt);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{max-width:1180px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:16px}.brand{font-weight:950;letter-spacing:-.04em;font-size:22px}.brand em{font-style:normal;color:var(--green)}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.18em;font-weight:800;margin-top:2px}.user{display:flex;align-items:center;gap:9px}.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#245a3a,#0c2115);display:grid;place-items:center;font-weight:900;border:1px solid #36724d}.tabs{display:flex;gap:7px;overflow:auto;padding:3px 0 14px}.tab{white-space:nowrap;background:#09140e;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-weight:750}.tab.active{background:#153622;color:#fff;border-color:#36744e}.card{background:linear-gradient(180deg,#0c1811,#09130e);border:1px solid var(--line);border-radius:17px;padding:17px;margin:11px 0;box-shadow:0 16px 45px #0004}.hero{padding:22px;background:linear-gradient(135deg,#10281a,#09140e 65%);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-90px;top:-90px;width:230px;height:230px;border-radius:50%;background:#39e27b0b}.eyebrow{color:var(--green);font-size:10px;font-weight:900;letter-spacing:.15em}.hero h1{font-size:30px;letter-spacing:-.04em;margin:5px 0}.muted{color:var(--muted)}.small{font-size:12px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.kpi{background:#0d1d15;border:1px solid var(--line);border-radius:13px;padding:13px}.kpi b{display:block;font-size:24px;margin:3px 0}.kpi .unit{font-size:10px;color:var(--muted);font-weight:700}.badge{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border:1px solid var(--line);border-radius:999px;background:#0a1710;color:#c5d8cc;font-size:11px;font-weight:800}.badge.good{color:#8ff3b2;border-color:#2b7048}.badge.warn{color:#ffe39a;border-color:#735d29}.badge.bad{color:#ffb1b1;border-color:#713437}.btn{background:var(--green);color:#031108;border:0;border-radius:11px;padding:11px 14px;font-weight:900}.btn.secondary{background:#12271b;color:#f5fff7;border:1px solid var(--line)}.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.btn.danger{background:#311518;color:#ffb5b5;border:1px solid #633036}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:11px;color:var(--muted);font-weight:750}input,select,textarea{width:100%;background:#07110c;color:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;outline:none}textarea{min-height:85px;resize:vertical}.bar{height:9px;background:#06100a;border:1px solid var(--line);border-radius:99px;overflow:hidden}.bar span{height:100%;display:block;border-radius:99px;background:linear-gradient(90deg,var(--green2),var(--green))}.bar.yellow span{background:var(--yellow)}.bar.red span{background:var(--red)}.list{display:grid;gap:8px}.item{border:1px solid var(--line);border-radius:12px;background:#0b1811;padding:12px}.section-title{margin:2px 0 9px;font-size:15px}.notice{padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#0c1e14;color:#c8d9cf}.timer{font-size:58px;text-align:center;font-weight:950;letter-spacing:-.05em;padding:10px}.exercise{display:flex;justify-content:space-between;gap:10px;align-items:center}.check{width:20px;height:20px;accent-color:var(--green)}.chart{width:100%;height:190px;background:#07110c;border:1px solid var(--line);border-radius:12px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(440px,100%);background:#0b1710;border:1px solid var(--line);border-radius:22px;padding:25px;box-shadow:0 25px 70px #0008}.logo{font-size:38px;font-weight:950;letter-spacing:-.06em}.logo em{font-style:normal;color:var(--green)}.loginbox .sub{color:var(--muted);margin-bottom:20px}.error{color:#ff9c9c;font-size:12px;margin-top:9px}.success{color:#80f0a8;font-size:12px;margin-top:9px}.hidden{display:none!important}.footer{text-align:center;color:#62796c;font-size:10px;padding:20px}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:20}.modalbox{width:min(620px,100%);max-height:90vh;overflow:auto;background:#0b1710;border:1px solid var(--line);border-radius:18px;padding:18px}.close{float:right;background:#14291c;color:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 9px}.tag{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:900}.rank{font-size:30px;font-weight:950}.achievement{display:flex;align-items:center;gap:10px}.achievement .ico{font-size:25px}.split{display:grid;grid-template-columns:1.35fr .65fr;gap:12px}
@media(max-width:760px){.app{padding:13px}.grid2,.grid3,.grid4,.split{grid-template-columns:1fr}.hero h1{font-size:26px}.top{align-items:flex-start}.hide-mobile{display:none}.timer{font-size:50px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const APP="FPC_PRO_V5",USERS=APP+"_users",SESSION=APP+"_session";
const $=id=>document.getElementById(id);
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random();
const users=()=>JSON.parse(localStorage.getItem(USERS)||"[]");
const saveUsers=x=>localStorage.setItem(USERS,JSON.stringify(x));
const sess=()=>JSON.parse(localStorage.getItem(SESSION)||"null");
const key=u=>APP+"_data_"+u.id;
const today=()=>new Date().toISOString().slice(0,10);
const fmt=d=>new Date(d+"T12:00:00").toLocaleDateString("pt-BR");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function defaults(u){return{profile:{name:u.name,email:u.email,position:"Meia / Lateral",foot:"Direito",goal:"Performance",number:"17"},checkins:[],sessions:[],matches:[],tests:[],events:[],skills:{Finalização:50,Condução:50,Passe:50,Velocidade:50,Agilidade:50,Defesa:50,Resistência:50,Decisão:50},badges:[],settings:{}}}
const data=()=>{const u=sess();return JSON.parse(localStorage.getItem(key(u))||JSON.stringify(defaults(u)))};
const save=d=>localStorage.setItem(key(sess()),JSON.stringify(d));
function loginUI(mode="login",msg=""){document.body.innerHTML=`<div class="login"><div class="loginbox">
<div class="logo">FPC <em>PRO</em></div><div class="sub">ATHLETE PERFORMANCE SYSTEM · V5</div>
<div class="row" style="margin-bottom:15px"><button class="btn ${mode==="login"?"":"secondary"}" style="flex:1" onclick="loginUI('login')">Entrar</button><button class="btn ${mode==="register"?"":"secondary"}" style="flex:1" onclick="loginUI('register')">Criar conta</button></div>
${mode==="register"?`<div class="field"><label>NOME DO ATLETA</label><input id="name" placeholder="Seu nome"></div>`:""}
<div class="field" style="margin-top:10px"><label>E-MAIL</label><input id="email" type="email" placeholder="voce@email.com"></div>
<div class="field" style="margin-top:10px"><label>SENHA</label><input id="pass" type="password" placeholder="Mínimo 6 caracteres"></div>
${mode==="register"?`<div class="field" style="margin-top:10px"><label>CONFIRMAR SENHA</label><input id="pass2" type="password"></div>`:""}
<button class="btn" style="width:100%;margin-top:15px" onclick="${mode==="login"?"doLogin()":"doRegister()"}">${mode==="login"?"Entrar no sistema":"Criar perfil de atleta"}</button>
${msg?`<div class="${msg.startsWith("OK")?"success":"error"}">${esc(msg.replace(/^OK\\s*/,""))}</div>`:""}
<div class="notice small" style="margin-top:16px">🔐 Perfil individual. Cada atleta usa seu próprio espaço de dados neste aparelho.</div>
</div></div>`}
function doRegister(){const n=$("name").value.trim(),e=$("email").value.trim().toLowerCase(),p=$("pass").value,p2=$("pass2").value;if(!n||!e||p.length<6||p!==p2)return loginUI("register","Confira seus dados e a senha.");if(users().some(x=>x.email===e))return loginUI("register","E-mail já cadastrado.");const u={id:uid(),name:n,email:e,pass:p};saveUsers([...users(),u]);localStorage.setItem(SESSION,JSON.stringify(u));saveDataNew(u,defaults(u));app()}
function saveDataNew(u,d){localStorage.setItem(key(u),JSON.stringify(d))}
function doLogin(){const e=$("email").value.trim().toLowerCase(),p=$("pass").value,u=users().find(x=>x.email===e&&x.pass===p);if(!u)return loginUI("login","E-mail ou senha incorretos.");localStorage.setItem(SESSION,JSON.stringify(u));app()}
function logout(){localStorage.removeItem(SESSION);loginUI("login","OK Você saiu do sistema.")}
function recentSessions(d,n=7){return d.sessions.slice(-n)}
function load7(d){return recentSessions(d).reduce((a,s)=>a+(Number(s.load)||Number(s.minutes||0)*Number(s.rpe||0)),0)}
function lastCheck(d){return d.checkins[d.checkins.length-1]||null}
function readiness(d){const x=readinessCalc();if(!x)return{score:70,label:"Faça seu check-in",tone:"warn"};return{score:x.score,label:x.score>=85?"PRONTO · ALTA INTENSIDADE":x.score>=70?"PRONTO · TREINO NORMAL":x.score>=55?"ATENÇÃO · REDUZIR CARGA":"RECUPERAÇÃO · BAIXA CARGA",tone:x.score>=85?"good":x.score>=55?"warn":"bad"}}
function rec(d){
const w=adaptiveWorkout(),r=readiness(d); let mins=60,rpe=7;
if(r.score<55){mins=30;rpe=3}else if(r.score<70){mins=45;rpe=5}else if(r.score<80){mins=55;rpe=6}
if(w){const m=String(w.duration).match(/(\d+)[–-](\d+)/);if(m)mins=Math.round((Number(m[1])+Number(m[2]))/2);rpe=w.targetRpe||rpe;}
return{focus:w?w.title:"Sessão adaptativa",mins,rpe,aiConfidence:w?.aiConfidence||0}
}
function app(){if(!sess())return loginUI();const u=sess();let d=data();document.body.innerHTML=`<div class="app">
<header class="top"><div class="brand">FPC <em>PRO</em><small>ATHLETE PERFORMANCE SYSTEM</small></div><div class="user"><span class="hide-mobile">${esc(u.name)}</span><div class="avatar">${esc((u.name||"A")[0].toUpperCase())}</div></div></header>
<nav class="tabs"><button class="tab active" onclick="page('dashboard',this)">Dashboard</button><button class="tab" onclick="page('checkin',this)">❤️ Check-in</button><button class="tab" onclick="page('training',this)">Treino</button><button class="tab" onclick="page('games',this)">⚽ Jogos</button><button class="tab" onclick="page('stats',this)">📊 Estatísticas</button><button class="tab" onclick="page('calendar',this)">Agenda</button><button class="tab" onclick="page('evolution',this)">Evolução</button><button class="tab" onclick="page('profile',this)">Perfil</button><button class="tab" onclick="page('account',this)">Conta</button></nav>
<main id="page"><button class="btn" onclick="weeklyReportPage()">📊 Relatório semanal</button></main><div class="footer">FPC PRO V10 · Athlete Edition · Performance • Load • Recovery</div></div>`;dashboard()}
function page(which,btn){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));if(btn)btn.classList.add("active");({dashboard,training,checkin:checkinPage,games:gamesPage,stats:statsPage,calendar,evolution,profile,account}[which])()}
function dashboard(){
const d=data(),r=readiness(d),rc=rec(d),c=lastCheck(d),u=sess(),week=load7(d),next=d.events.filter(e=>e.date>=today()).sort((a,b)=>a.date.localeCompare(b.date))[0];
$("page").innerHTML=`<section class="card hero"><div class="eyebrow">DAILY PERFORMANCE STATUS</div><h1>Olá, ${esc(u.name.split(" ")[0])}.</h1><p class="muted">Seu plano de hoje foi ajustado pelo seu estado de recuperação.</p><div class="grid3"><div class="kpi"><span class="tag">Readiness</span><b>${r.score}%</b><span class="badge ${r.tone}">${r.label}</span></div><div class="kpi"><span class="tag">Carga 7D</span><b>${Math.round(week)}</b><span class="unit">AU · sessão × RPE</span></div><div class="kpi"><span class="tag">Próximo evento</span><b>${next?fmt(next.date):"—"}</b><span class="unit">${next?esc(next.title):"Sem evento"}</span></div></div></section>
<div class="split"><div>
<div class="card"><div class="between"><h2 class="section-title">Plano recomendado</h2><span class="badge good">AUTO</span></div><h2>${esc(rc.focus)}</h2><p class="muted">${rc.mins} min · intensidade alvo RPE ${rc.rpe}</p><div class="row"><button class="btn" onclick="page('training')">Iniciar treino</button><button class="btn secondary" onclick="quickSession()">Registrar sessão</button></div></div>
<div class="card"><h2 class="section-title">Check-in do atleta</h2><div class="grid2"><div class="field"><label>SONO · HORAS</label><input id="sleep" type="number" step=".1" min="0" max="14" value="${c?.sleep??8}"></div><div class="field"><label>ENERGIA · 0–10</label><input id="energy" type="number" min="0" max="10" value="${c?.energy??7}"></div><div class="field"><label>DOR · 0–10</label><input id="pain" type="number" min="0" max="10" value="${c?.pain??0}"></div><div class="field"><label>FADIGA · 0–10</label><input id="fatigue" type="number" min="0" max="10" value="${c?.fatigue??3}"></div></div><div class="row" style="margin-top:11px"><button class="btn" onclick="checkin()">Salvar check-in</button><span class="muted small">${c?fmt(c.date):"Ainda não registrado hoje"}</span></div></div>
</div><div>
<div class="card"><h2 class="section-title">Perfil de jogo</h2><div class="item"><div class="between"><b>${esc(d.profile.position)}</b><span class="badge">#${esc(d.profile.number)}</span></div><div class="muted small" style="margin-top:5px">Pé ${esc(d.profile.foot)} · foco: ${esc(d.profile.goal)}</div></div></div>
<div class="card"><h2 class="section-title">Última sessão</h2>${d.sessions.length?(()=>{let s=d.sessions[d.sessions.length-1];return `<div class="item"><b>${esc(s.focus)}</b><br><span class="muted">${s.minutes} min · RPE ${s.rpe} · ${s.load} AU</span></div>`})():"<div class='muted'>Nenhuma sessão ainda.</div>"}</div>
<div class="card"><div class="between"><h2 class="section-title">🧠 Performance Intelligence</h2><span class="badge good">ADAPTATIVO</span></div>${(()=>{const i=historyIntel(),ratio=i.ratio;const trend=ratio>1.25?"carga subindo":ratio<.75&&i.acute>0?"carga baixa":"carga estável";const text=ratio>1.35?"O sistema reduziu o volume porque sua carga recente está acima do padrão.":ratio>1.15?"O sistema está controlando o volume para evitar uma subida rápida de carga.":"Sua carga está dentro de uma faixa controlada. O histórico está sendo usado para ajustar a sessão.";return `<div class="grid3"><div class="kpi"><span class="tag">Carga 7D</span><b>${Math.round(i.acute)}</b><span class="unit">AU</span></div><div class="kpi"><span class="tag">Tendência</span><b>${trend}</b></div><div class="kpi"><span class="tag">Padrão</span><b>${i.chronicWeekly?Math.round(i.chronicWeekly):"—"}</b><span class="unit">AU/SEMANA</span></div></div><p class="muted small" style="margin-top:10px">💡 ${text}</p>`})()}</div>
<div class="card"><div class="between"><h2 class="section-title">🤖 FPC AI Learning</h2><span class="badge good">${aiLearning().confidence}% confiança</span></div>
<div class="grid3"><div class="kpi"><span class="tag">Modo</span><b>${aiLearning().label}</b></div><div class="kpi"><span class="tag">Amostras</span><b>${aiLearning().samples}</b><span class="unit">SESSÕES</span></div><div class="kpi"><span class="tag">Ajuste pessoal</span><b>${Math.round(aiLearning().factor*100)}%</b><span class="unit">DO PADRÃO</span></div></div>
<p class="muted small" style="margin-top:10px">🧠 ${aiLearning().reason}</p>
<p class="muted small">A recomendação é recalibrada pela sua resposta real: qualidade, RPE e dor pós-treino.</p></div>
<div class="card"><h2 class="section-title">Conquistas</h2><div class="achievement"><span class="ico">🏅</span><div><b>${d.badges.length} badges</b><br><span class="muted small">${badgeText(d)}</span></div></div></div>
</div></div>`;
}
function badgeText(d){if(d.sessions.length>=20)return"20+ sessões concluídas";if(d.sessions.length>=10)return"10+ sessões concluídas";if(d.sessions.length>=1)return"Primeira sessão concluída";return"Seu primeiro badge está a uma sessão de distância."}
function checkin(){const u=sess(),d=data(),o={date:today(),sleep:+$("sleep").value,energy:+$("energy").value,pain:+$("pain").value,fatigue:+$("fatigue").value};d.checkins=d.checkins.filter(x=>x.date!==today());d.checkins.push(o);save(d);dashboard()}
let timer=0,interval=null;
function training(){
const d=data(),r=readiness(d),rc=rec(d),blocks=[["Ativação + mobilidade",7],["Aceleração curta",8],["Mudança de direção",8],["Técnica específica",12],["Tomada de decisão / jogo reduzido",12],["Volta à calma",6]];
$("page").innerHTML=`<div class="card hero"><div class="eyebrow">TRAINER MODE</div><h1>${esc(rc.focus)}</h1><div class="row"><span class="badge ${r.tone}">READINESS ${r.score}%</span><span class="badge">${rc.mins} MIN</span><span class="badge">RPE ${rc.rpe}</span><span class="badge good">AI ${rc.aiConfidence}%</span></div><div class="timer" id="timer">00:00</div><div class="row" style="justify-content:center"><button class="btn" onclick="startTimer()">Iniciar</button><button class="btn secondary" onclick="resetTimer()">Zerar</button></div></div>
<div class="card"><div class="between"><h2 class="section-title">Sessão de hoje</h2><span class="muted small">marque os blocos realizados</span></div><div class="list">${blocks.map((x,i)=>`<label class="item exercise"><span><input class="check" type="checkbox" id="b${i}"> ${x[0]}</span><b>${x[1]}'</b></label>`).join("")}</div><button class="btn" style="margin-top:12px" onclick="finishSession()">Finalizar sessão</button></div>
<div class="card"><h2 class="section-title">Ajuste automático</h2><div class="notice">${r.score>=85?"Seu estado permite manter intensidade alta.":r.score>=70?"Mantenha a sessão planejada e monitore RPE.":r.score>=55?"Reduza volume e priorize qualidade técnica.":"Hoje o foco deve ser recuperação e baixa carga."}</div></div>`;
}
function startTimer(){clearInterval(interval);interval=setInterval(()=>{timer++;if($("timer"))$("timer").textContent=new Date(timer*1000).toISOString().slice(14,19)},1000)}
function resetTimer(){clearInterval(interval);timer=0;if($("timer"))$("timer").textContent="00:00"}
function finishSession(){const d=data(),rc=rec(d),plan=adaptiveWorkout(),mins=+prompt("Minutos realizados",rc.mins);if(!mins)return;const rpe=+prompt("RPE da sessão (0–10)",rc.rpe);if(isNaN(rpe))return;const quality=+prompt("Como foi a qualidade da sessão? 0–10",8);const postPain=+prompt("Dor após a sessão 0–10",0);const s={id:uid(),date:today(),focus:rc.focus,minutes:mins,rpe,load:Math.round(mins*rpe),plannedMinutes:rc.mins,plannedRpe:rc.rpe,plannedScore:plan?.score||readiness(d).score,quality:isNaN(quality)?8:Math.max(0,Math.min(10,quality)),postPain:isNaN(postPain)?0:Math.max(0,Math.min(10,postPain))};d.sessions.push(s);d.feedback=d.feedback||[];d.feedback.push({sessionId:s.id,date:s.date,planned:{minutes:rc.mins,rpe:rc.rpe},actual:{minutes:mins,rpe,quality:s.quality,postPain:s.postPain},gap:{minutes:mins-rc.mins,rpe:rpe-rc.rpe}});for(const k of Object.keys(d.skills))if(Math.random()<.35)d.skills[k]=Math.min(100,d.skills[k]+1);if(d.sessions.length===1&&!d.badges.includes("first"))d.badges.push("first");if(d.sessions.length>=10&&!d.badges.includes("10"))d.badges.push("10");if(d.sessions.length>=20&&!d.badges.includes("20"))d.badges.push("20");save(d);resetTimer();alert("Sessão salva · "+s.load+" AU");dashboard()}
function quickSession(){
const d=data(),rc=rec(d),mins=+prompt("Minutos",rc.mins),rpe=+prompt("RPE",rc.rpe);
if(!mins||isNaN(rpe))return;
const quality=+prompt("Qualidade da sessão 0–10",8),postPain=+prompt("Dor pós-sessão 0–10",0);
const s={id:uid(),date:today(),focus:rc.focus,minutes:mins,rpe,load:Math.round(mins*rpe),plannedMinutes:rc.mins,plannedRpe:rc.rpe,plannedScore:readiness(d).score,quality:isNaN(quality)?8:quality,postPain:isNaN(postPain)?0:postPain};
d.sessions.push(s);d.feedback=d.feedback||[];
d.feedback.push({sessionId:s.id,date:s.date,planned:{minutes:rc.mins,rpe:rc.rpe},actual:{minutes:mins,rpe,quality:s.quality,postPain:s.postPain},gap:{minutes:mins-rc.mins,rpe:rpe-rc.rpe}});
save(d);dashboard()
}
function calendar(){
const d=data(),days=[];for(let i=0;i<14;i++){let dt=new Date();dt.setDate(dt.getDate()+i);days.push(dt.toISOString().slice(0,10))}
$("page").innerHTML=`<div class="card"><div class="between"><div><div class="eyebrow">PLANEJAMENTO</div><h1>Agenda</h1></div><button class="btn" onclick="addEvent()">+ Evento</button></div><p class="muted">Organize treino, jogo, descanso e testes para o seu ciclo.</p></div>

function historyIntel(){
const d=data(), now=new Date(today()+"T12:00:00"), sessions=[...(d.sessions||[]),...(d.matches||[]).map(g=>({...g,focus:"Jogo · "+(g.opponent||"Partida"),load:g.load||((g.minutes||0)*(g.rpe||0))}))].filter(x=>x.date);
const daysAgo=x=>Math.floor((now-new Date(x.date+"T12:00:00"))/86400000);
const inRange=(x,n)=>daysAgo(x)>=0&&daysAgo(x)<n;
const acute=sessions.filter(x=>inRange(x,7)).reduce((a,x)=>a+(Number(x.load)||0),0);
const last3=sessions.filter(x=>inRange(x,3)).reduce((a,x)=>a+(Number(x.load)||0),0);
const prev21=sessions.filter(x=>{const q=daysAgo(x);return q>=7&&q<28}).reduce((a,x)=>a+(Number(x.load)||0),0);
const chronicWeekly=prev21/3;
const ratio=chronicWeekly?acute/chronicWeekly:1;
const checks=(d.checkins||[]).filter(x=>inRange(x,14));
const avg=(k,def)=>checks.length?checks.reduce((a,x)=>a+(Number(x[k])||0),0)/checks.length:def;
const baseline={sleep:avg("sleep",8),energy:avg("energy",7),mood:avg("mood",7),readiness:avg("readiness",7),pain:avg("pain",0)};
const recent=sessions.filter(x=>inRange(x,7));
const avgRpe=recent.length?recent.reduce((a,x)=>a+(Number(x.rpe)||0),0)/recent.length:0;
return {acute,last3,chronicWeekly,ratio,baseline,avgRpe,sessions:sessions.sort((a,b)=>String(b.date).localeCompare(String(a.date)))};
}
function readinessCalc(){
const d=data(), c=(d.checkins||[]).find(x=>x.date===today());
if(!c)return null;
const intel=historyIntel();
const sleep=Math.max(0,Math.min(10,(Number(c.sleep)||0)/8*10));
const energy=Number(c.energy)||0, pain=Number(c.pain)||0, mood=Number(c.mood)||0, disp=Number(c.readiness)||0;
let score=(sleep*.20+energy*.25+mood*.15+disp*.25+(10-pain)*.15)*10;
if(intel.ratio>1.35)score-=8; else if(intel.ratio>1.15)score-=4;
if(intel.last3>900)score-=5; else if(intel.last3>650)score-=2;
if(pain>=6)score-=18; else if(pain>=4)score-=8;
if(intel.baseline.energy&&energy<intel.baseline.energy-2)score-=4;
if(intel.baseline.sleep&&Number(c.sleep)<intel.baseline.sleep-1.5)score-=4;
score=Math.max(20,Math.min(100,Math.round(score)));
let zone=score>=80?"green":score>=60?"yellow":"red";
if(pain>=6)zone="red";
return {score,zone,load3:intel.last3,acute:intel.acute,ratio:intel.ratio,baseline:intel.baseline};
}


function weeklyReport(){
const d=data(), sessions=(d.sessions||[]).filter(s=>s.date).slice(-7);
const checkins=(d.checkins||[]).slice(-7);
const loads=sessions.map(s=>Number(s.load)||0);
const totalLoad=loads.reduce((a,b)=>a+b,0);
const minutes=sessions.reduce((a,s)=>a+(Number(s.minutes)||0),0);
const avgRpe=sessions.length?sessions.reduce((a,s)=>a+(Number(s.rpe)||0),0)/sessions.length:0;
const avgQuality=sessions.length?sessions.reduce((a,s)=>a+(Number(s.quality)||0),0)/sessions.length:null;
const painValues=[...sessions.map(s=>Number(s.postPain)),...checkins.map(c=>Number(c.pain))].filter(Number.isFinite);
const avgPain=painValues.length?painValues.reduce((a,b)=>a+b,0)/painValues.length:0;
const sleep=checkins.map(c=>Number(c.sleep)).filter(Number.isFinite);
const energy=checkins.map(c=>Number(c.energy)).filter(Number.isFinite);
const readinessValues=checkins.map(c=>Number(c.readiness||c.score)).filter(Number.isFinite);
const avgSleep=sleep.length?sleep.reduce((a,b)=>a+b,0)/sleep.length:null;
const avgEnergy=energy.length?energy.reduce((a,b)=>a+b,0)/energy.length:null;
const avgReadiness=readinessValues.length?readinessValues.reduce((a,b)=>a+b,0)/readinessValues.length:null;
const ai=aiLearning();
const intel=historyIntel();
let evolution="Estável",risk="Baixo",recommendation="Mantenha a progressão gradual.";
if(avgPain>=3 || intel.ratio>1.35){risk="Atenção";recommendation="Reduza volume e priorize recuperação antes de aumentar intensidade.";}
else if(avgRpe>=8.2 || intel.ratio>1.15){risk="Moderado";recommendation="Mantenha intensidade, mas controle o volume da próxima sessão.";}
else if(avgReadiness!==null && avgReadiness>=80 && avgPain<=1.5){evolution="Positiva";recommendation="Boa resposta. Pode progredir de forma conservadora.";}
if(avgQuality!==null && avgQuality>=8)evolution="Positiva";
return {sessions:sessions.length,totalLoad,minutes,avgRpe,avgQuality,avgPain,avgSleep,avgEnergy,avgReadiness,
evolution,risk,recommendation,aiConfidence:ai.confidence,aiFactor:ai.factor,loadRatio:intel.ratio};
}

function aiLearning(){
const d=data(), fb=d.feedback||[];
if(!fb.length) return {factor:1,confidence:0,label:"Aprendizado inicial",reason:"Ainda não há sessões suficientes para calibrar seu perfil.",samples:0};
const recent=fb.slice(-12); let score=0,weight=0;
recent.forEach((f,i)=>{
 const w=.5+(i+1)/recent.length, q=Number(f.actual?.quality)||0, pain=Number(f.actual?.postPain)||0, gap=Math.abs(Number(f.gap?.rpe)||0);
 let o=q/10; if(pain>=4)o-=.35; else if(pain>=2)o-=.12; if(gap>=2)o-=.08;
 score+=Math.max(0,Math.min(1,o))*w; weight+=w;
});
const quality=weight?score/weight:.5;
let factor=.88+quality*.24, last=recent[recent.length-1];
if(last){
 const ar=Number(last.actual?.rpe), pr=Number(last.planned?.rpe), pain=Number(last.actual?.postPain)||0;
 if(pain>=5||ar>=pr+2)factor-=.06;
 if(Number(last.actual?.quality)>=9&&pain<=1&&ar<=pr+1)factor+=.04;
}
factor=Math.max(.82,Math.min(1.15,factor));
const confidence=Math.min(95,Math.round(25+recent.length*6));
const label=confidence>=70?"Aprendizado consolidado":confidence>=45?"Aprendizado em evolução":"Aprendizado inicial";
const reason=quality>=.82?"Você tem respondido bem às cargas propostas; o sistema pode progredir com cautela.":quality>=.65?"Sua resposta às sessões está estável; o sistema mantém a progressão controlada.":"Sua resposta recente pede cautela; o sistema tende a reduzir volume/intensidade.";
return {factor,confidence,label,reason,samples:recent.length,quality};
}
function aiRecommendation(){
const r=readinessCalc(),intel=historyIntel(),ai=aiLearning(); if(!r)return null;
let volume=ai.factor,intensity=ai.factor;
if(r.zone==="yellow"){volume*=.82;intensity*=.92}
if(r.zone==="red"){volume*=.55;intensity*=.72}
if(intel.ratio>1.35)volume*=.78; else if(intel.ratio>1.15)volume*=.90;
if(intel.avgRpe>8)intensity*=.94;
return {volume:Math.max(.45,Math.min(1.1,volume)),intensity:Math.max(.55,Math.min(1.08,intensity)),...ai};
}

function adaptiveWorkout(){
const r=readinessCalc(),d=data(); if(!r)return null;
const p=(d.profile.position||"").toLowerCase(),ai=aiRecommendation();
let title="Performance — Sessão completa",duration="60–75 min",focus=["Ativação + mobilidade","Aceleração / velocidade","Força e potência","Técnica específica","Tomada de decisão"],color="good";
if(p.includes("lateral"))focus=["Ativação + mobilidade","Aceleração e mudança de direção","1x1 defensivo + recuperação","Cruzamento / passe em progressão","Jogo reduzido com decisão"];
else if(p.includes("meia"))focus=["Ativação + mobilidade","Passe sob pressão","Aceleração curta","Recepção orientada + tomada de decisão","Jogo reduzido"];
else if(p.includes("volante"))focus=["Ativação + mobilidade","Cobertura + deslocamento","Passe sob pressão","Aceleração curta","Jogo reduzido / transição"];
else if(p.includes("ponta"))focus=["Ativação + mobilidade","Aceleração + 1x1","Finalização","Mudança de direção","Jogo reduzido"];
if(r.zone==="yellow"){title="Performance — Intensidade moderada";duration="45–60 min";focus=focus.slice(0,4);color="warn"}
if(r.zone==="red"){title="Recovery — Recuperação ativa";duration="25–40 min";focus=["Mobilidade","Ativação leve","Core de baixa intensidade","Técnica leve / controle de bola"];color="bad"}
if(r.ratio>1.35&&r.zone!=="red"){title="Controle de carga — Qualidade";duration="40–55 min";focus=["Mobilidade + ativação","Técnica de alta qualidade","Aceleração curta com volume reduzido","Tomada de decisão sem excesso de volume"];color="warn"}
let [lo,hi]=duration.replace(" min","").split("–").map(Number);
if(ai){lo=Math.round(lo*ai.volume);hi=Math.round(hi*ai.volume);duration=`${Math.max(20,lo)}–${Math.max(25,hi)} min`;}
const base=r.score>=85?7:r.score>=70?6:r.score>=55?5:3;
const targetRpe=Math.max(2,Math.min(9,Math.round(base*(ai?.intensity||1)*10)/10));
const reason=r.ratio>1.35?"carga recente acima do seu padrão":r.last3>650?"volume dos últimos 3 dias elevado":r.score>=80?"boa prontidão e carga controlada":"sinais de recuperação pedem controle";
return {title,duration,focus,color,reason,score:r.score,aiConfidence:ai?.confidence||0,aiLabel:ai?.label||"Aprendizado inicial",aiReason:ai?.reason||"",targetRpe};
}

<div class="kpi"><span class="tag">Min / jogo</span><b>${avgMin.toFixed(0)}</b><span class="unit">MÉDIA</span></div>
</div>
<div class="card"><div class="between"><h2 class="section-title">Indicadores técnicos</h2><span class="tag">ACUMULADO</span></div>
<div class="grid4">
<div class="kpi"><span class="tag">Desarmes</span><b>${total("tackles")}</b></div>
<div class="kpi"><span class="tag">Interceptações</span><b>${total("interceptions")}</b></div>
<div class="kpi"><span class="tag">Duelos ganhos</span><b>${total("duelsWon")}</b></div>
<div class="kpi"><span class="tag">Passes-chave</span><b>${total("keyPasses")}</b></div>
</div></div>
<div class="card"><div class="between"><h2 class="section-title">Evolução por jogo</h2><span class="muted small">Últimas 10 partidas</span></div>
${m.slice(-10).map((g,i)=>`<div style="margin:14px 0"><div class="between"><span><b>${esc(g.opponent||"Adversário")}</b> <span class="muted small">${fmt(g.date)}</span></span><b>${Number(g.rating||0).toFixed(1)}</b></div><div class="bar" style="margin-top:7px"><span style="width:${Math.min(100,Number(g.rating||0)*10)}%"></span></div><div class="muted small" style="margin-top:4px">${g.minutes||0} min · ${g.goals||0} G · ${g.assists||0} A · RPE ${g.rpe||0}</div></div>`).reverse().join("")||"<div class='muted'>Registre seus jogos para começar a construir sua evolução.</div>"}</div>
<div class="card"><div class="between"><h2 class="section-title">Histórico completo</h2><button class="btn secondary" onclick="page('games')">Registrar jogo</button></div>
<div class="list">${m.slice().reverse().map(g=>`<div class="item"><div class="between"><b>${esc(g.opponent||"Adversário")}</b><span class="badge good">Nota ${Number(g.rating||0).toFixed(1)}</span></div><div class="muted small" style="margin-top:6px">${fmt(g.date)} · ${esc(g.competition||"Jogo")} · ${g.minutes||0} min</div></div>`).join("")||"<div class='muted'>Sem histórico ainda.</div>"}</div></div>`;
}
function evolution(){
const d=data(),sessions=d.sessions.slice(-12),loads=sessions.map(x=>x.load),max=Math.max(1,...loads);
$("page").innerHTML=`<div class="card"><div class="eyebrow">PERFORMANCE LAB</div><h1>Evolução</h1><p class="muted">Acompanhe carga, habilidades e testes físicos ao longo do tempo.</p></div>
<div class="grid4"><div class="kpi"><span class="tag">Sessões</span><b>${d.sessions.length}</b></div><div class="kpi"><span class="tag">Carga total</span><b>${Math.round(d.sessions.reduce((a,x)=>a+x.load,0))}</b><span class="unit">AU</span></div><div class="kpi"><span class="tag">Jogos</span><b>${d.matches.length}</b></div><div class="kpi"><span class="tag">Badges</span><b>${d.badges.length}</b></div></div>
<div class="card"><h2 class="section-title">Carga das últimas sessões</h2><canvas id="loadChart" class="chart" height="190"></canvas></div>
<div class="card"><h2 class="section-title">Perfil técnico</h2>${Object.entries(d.skills).map(([k,v])=>`<div style="margin:11px 0"><div class="between"><span>${k}</span><b>${v}/100</b></div><div class="bar"><span style="width:${v}%"></span></div></div>`).join("")}</div>
<div class="card"><h2 class="section-title">Testes físicos</h2><button class="btn" onclick="addTest()">+ Registrar teste</button><div class="list" style="margin-top:10px">${d.tests.slice().reverse().slice(0,10).map(t=>`<div class="item"><b>${esc(t.name)}</b> · ${esc(t.value)} ${esc(t.unit)}<br><span class="muted">${fmt(t.date)}</span></div>`).join("")||"<div class='muted'>Registre seu primeiro teste.</div>"}</div></div>`;
setTimeout(()=>drawChart(sessions,max),30)}
function drawChart(ss,max){const c=$("loadChart");if(!c)return;const ctx=c.getContext("2d"),w=c.clientWidth*devicePixelRatio,h=c.clientHeight*devicePixelRatio;c.width=w;c.height=h;ctx.clearRect(0,0,w,h);ctx.strokeStyle="#244434";ctx.lineWidth=1;for(let i=1;i<5;i++){let y=h-i*h/5;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}if(!ss.length){ctx.fillStyle="#8fa79a";ctx.font="14px system-ui";ctx.fillText("Sem dados ainda",18,30);return}ctx.strokeStyle="#4df28a";ctx.lineWidth=3;ctx.beginPath();ss.forEach((s,i)=>{let x=25+i*(w-50)/Math.max(1,ss.length-1),y=h-20-(s.load/max)*(h-45);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ss.forEach((s,i)=>{let x=25+i*(w-50)/Math.max(1,ss.length-1),y=h-20-(s.load/max)*(h-45);ctx.fillStyle="#4df28a";ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill()})}
function addTest(){const d=data(),types=[["10m","s"],["20m","s"],["5-10-5","s"],["Salto vertical","cm"],["Yo-Yo / distância","m"],["Domínio de bola","s"]];const n=prompt("Teste: "+types.map(x=>x[0]).join(" | "),"10m");if(!n)return;const found=types.find(x=>x[0].toLowerCase()===n.toLowerCase());const v=prompt("Resultado");if(v===null)return;d.tests.push({id:uid(),name:n,value:v,unit:found?found[1]:"",date:today()});save(d);evolution()}
function profile(){
const d=data();$("page").innerHTML=`<div class="card"><div class="eyebrow">ATHLETE IDENTITY</div><h1>Perfil</h1><div class="grid2"><div class="field"><label>NOME</label><input id="pn" value="${esc(d.profile.name)}"></div><div class="field"><label>NÚMERO</label><input id="pnum" value="${esc(d.profile.number)}"></div><div class="field"><label>POSIÇÃO</label><select id="pp">${["Meia / Lateral","Volante","Lateral","Ponta","Fixo","Zagueiro","Atacante"].map(x=>`<option ${x===d.profile.position?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>PÉ DOMINANTE</label><select id="pf">${["Direito","Esquerdo","Ambidestro"].map(x=>`<option ${x===d.profile.foot?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>OBJETIVO</label><select id="pg">${["Performance","Velocidade","Resistência","Força/Potência","Técnica","Emagrecimento","Retorno ao esporte"].map(x=>`<option ${x===d.profile.goal?"selected":""}>${x}</option>`).join("")}</select></div></div><button class="btn" style="margin-top:12px" onclick="saveProfile()">Salvar alterações</button></div>
<div class="card"><h2 class="section-title">ID de performance</h2><div class="grid3"><div class="kpi"><span class="tag">Posição</span><b>${esc(d.profile.position)}</b></div><div class="kpi"><span class="tag">Pé</span><b>${esc(d.profile.foot)}</b></div><div class="kpi"><span class="tag">Número</span><b>#${esc(d.profile.number)}</b></div></div></div>`}
function saveProfile(){const d=data();d.profile.name=$("pn").value;d.profile.number=$("pnum").value;d.profile.position=$("pp").value;d.profile.foot=$("pf").value;d.profile.goal=$("pg").value;save(d);app()}
function account(){
const u=sess();$("page").innerHTML=`<div class="card"><div class="eyebrow">ACCOUNT</div><h1>${esc(u.name)}</h1><p class="muted">${esc(u.email)}</p><div class="row"><button class="btn secondary" onclick="exportData()">Exportar dados</button><button class="btn secondary" onclick="importData()">Importar dados</button><button class="btn secondary" onclick="logout()">Sair</button></div></div>
<div class="card"><h2 class="section-title">Seu espaço</h2><div class="notice">Cada atleta tem um perfil independente. Esta Athlete Edition não possui painel de treinador por enquanto — essa parte fica para uma futura versão.</div></div>
<div class="card"><h2 class="section-title">Privacidade</h2><p class="muted small">Os dados desta edição ficam separados no navegador. O objetivo é que cada aluno use o próprio perfil sem enxergar os dados dos outros.</p></div>`}
function exportData(){const u=sess(),blob=new Blob([JSON.stringify({user:{name:u.name,email:u.email},data:data()},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="fpc-pro-"+u.name.replace(/[^a-z0-9]/gi,"_")+".json";a.click();URL.revokeObjectURL(a.href)}
function importData(){const i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>{const f=i.files[0],r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.data)throw 0;save(x.data);app()}catch(e){alert("Arquivo inválido.")}};r.readAsText(f)};i.click()}
if(sess())app();else loginUI();
</script>
